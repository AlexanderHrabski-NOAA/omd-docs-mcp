name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request supersedes its in-flight run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Fail if uv.lock is out of date instead of silently re-resolving it.
  UV_LOCKED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          # The shipped Docker image runs Python 3.12.
          python-version: "3.12"
      - run: uv sync
      - name: Unit and regression tests
        run: uv run python -m unittest discover -s tests -t .
      # A script, not a unittest module, so `discover` above does not collect it.
      - name: MCP stdio smoke test
        run: uv run python -m tests.smoke_mcp

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # The same hooks developers run locally; .pre-commit-config.yaml is the single source of truth.
      - run: uvx pre-commit run --all-files --show-diff-on-failure
