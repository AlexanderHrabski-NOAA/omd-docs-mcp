services:
  omd-mcp:
    image: omd-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INCLUDE_PYTORCH: ${INCLUDE_PYTORCH:-0}
    container_name: omd-mcp
    stdin_open: true
    tty: false
    init: true
    read_only: true
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
