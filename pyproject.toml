[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omd-mcp"
version = "1.1.0"
description = "Version-scoped ESMF 8.9.1 sections and Fortran routines for NUOPC agents"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "beautifulsoup4>=4.12,<5", "numpy>=1.26,<3", "fastembed==0.9.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["knowledge", "server", "ingest", "build_embeddings", "fetch_corpus", "fetch_kokkos", "fetch_standards", "fetch_pytorch", "fetch_weather", "build_manifest"]
